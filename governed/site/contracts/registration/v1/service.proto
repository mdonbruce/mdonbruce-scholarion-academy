syntax = "proto3";
package registration.v1;
service EnrollmentService { rpc CreateEnrollment (CreateEnrollmentRequest) returns (CreateEnrollmentResponse); }
message CreateEnrollmentRequest { string learner_id = 1; string section_id = 2; string idempotency_key = 3; }
