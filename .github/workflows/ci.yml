name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each step tees its output; on failure the tail is surfaced as an annotation
      # so it is readable from the run summary without downloading logs.
      - name: Install
        run: |
          set -o pipefail
          (if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi) 2>&1 | tee install.log
      - name: Test
        env:
          CLOUDLAB_LOCAL_RUNNER: "1"
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Python governed service (governed/site)
        working-directory: governed/site
        run: |
          set -o pipefail
          (python -m pip install --quiet cryptography Pillow python-docx python-pptx reportlab \
            && python -m unittest discover -p 'test_*.py' \
            && python validate.py \
            && for f in test-*.cjs; do node "$f"; done) 2>&1 | tee ../../python.log
      - name: Campus screens + accessibility (axe)
        env:
          CLOUDLAB_LOCAL_RUNNER: "1"
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium > pw.log 2>&1 || (tail -n 20 pw.log; exit 1)
          (npm run campus:render && npm run campus:a11y) 2>&1 | tee a11y.log
          echo "::notice title=Accessibility::$(grep '^axe:' a11y.log)"
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Smoke test (next start)
        env:
          CLOUDLAB_LOCAL_RUNNER: "1"
          SCHOLARION_PUBLIC_URL: http://localhost:3000
        run: |
          set -o pipefail
          (npm run start -- -p 3000 > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
          node scripts/smoke.mjs 2>&1 | tee smoke.log || (echo "--- server log ---" >> smoke.log; tail -n 60 server.log >> smoke.log; exit 1)
          echo "::notice title=Smoke test::$(grep -c '^ok' smoke.log) checks passed, $(grep -c '^FAIL' smoke.log) failed. $(grep '^status board' smoke.log)"

      - name: Report failure output
        if: failure()
        run: |
          for f in install test python a11y build smoke; do
            [ -f "$f.log" ] || continue
            if [ "$f" = test ] && grep -q "not ok" test.log; then
              grep -n -A30 "^\s*not ok" test.log | grep -v "^\S*-\s*\(duration_ms\|type:\|\.\.\.\|---\)" | head -n 120 | sed 's/\x1b\[[0-9;]*m//g' > tail.txt
            else
              tail -n 80 "$f.log" | sed 's/\x1b\[[0-9;]*m//g' > tail.txt
            fi
            msg=$(python3 -c "import sys;print(open('tail.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=$f output (last 80 lines)::$msg"
          done
